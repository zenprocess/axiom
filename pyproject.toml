[project]
name = "axiom-rdl"
version = "0.1.0"
description = "A compact Rule Definition Language for AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "V. Vladescu", email = "vlad@zenprocess.io"},
]
keywords = ["llm", "rules", "context-engineering", "prompt-compression", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/zenprocess/axiom"
Repository = "https://github.com/zenprocess/axiom"
Specification = "https://github.com/zenprocess/axiom/blob/main/spec.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
